<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="60%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>
    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA84A" />
      <stop offset="100%" stop-color="#E27300" />
    </linearGradient>
    <linearGradient id="pattyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6F3818" />
      <stop offset="100%" stop-color="#451E07" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Circle -->
  <rect width="100" height="100" rx="24" fill="#131722" />
  <circle cx="50" cy="50" r="44" stroke="#FF5E36" stroke-width="2.5" fill="none" opacity="0.4" />

  <!-- Background Flames -->
  <path d="M 50 16 Q 64 35 56 52 Q 72 38 78 58 Q 84 80 50 86 Q 16 80 22 58 Q 28 38 44 52 Q 36 35 50 16 Z" fill="url(#flameGrad)" filter="url(#glow)" opacity="0.9" />

  <!-- Burger Bun Bottom -->
  <path d="M 28 72 C 28 69 72 69 72 72 C 72 77 65 80 50 80 C 35 80 28 77 28 72 Z" fill="url(#bunGrad)" stroke="#B35900" stroke-width="1.5" />

  <!-- Patty -->
  <rect x="25" y="64" width="50" height="7" rx="3.5" fill="url(#pattyGrad)" stroke="#2E1304" stroke-width="1.2" />

  <!-- Cheese Melt -->
  <path d="M 26 63 L 74 63 L 68 70 L 60 65 L 53 71 L 46 65 L 38 70 Z" fill="#FFD166" />

  <!-- Fresh Lettuce -->
  <path d="M 24 59 Q 32 63 40 59 Q 48 63 56 59 Q 64 63 72 59 Q 76 61 74 63 L 26 63 Z" fill="#2EC4B6" />

  <!-- Bun Top with Smile -->
  <path d="M 26 56 C 26 38 74 38 74 56 Z" fill="url(#bunGrad)" stroke="#B35900" stroke-width="1.5" />
  
  <!-- Sesame Seeds -->
  <ellipse cx="40" cy="46" rx="2" ry="1.2" fill="#FFE5B4" transform="rotate(-15 40 46)" />
  <ellipse cx="52" cy="43" rx="2" ry="1.2" fill="#FFE5B4" />
  <ellipse cx="62" cy="47" rx="2" ry="1.2" fill="#FFE5B4" transform="rotate(15 62 47)" />

  <!-- Cute Eyes and Smile -->
  <circle cx="43" cy="51" r="2.2" fill="#2B1600" />
  <circle cx="57" cy="51" r="2.2" fill="#2B1600" />
  <circle cx="44" cy="50" r="0.8" fill="#FFF" />
  <circle cx="58" cy="50" r="0.8" fill="#FFF" />
  <path d="M 48 53 Q 50 56 52 53" fill="none" stroke="#2B1600" stroke-width="1.2" stroke-linecap="round" />

  <!-- Chef Hat -->
  <path d="M 40 38 L 60 38 L 59 34 L 41 34 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
  <rect x="42" y="34.5" width="16" height="3" fill="#FF5E36" rx="1" />
  <path d="M 40 34 C 34 32 34 22 43 22 C 45 16 55 16 57 22 C 66 22 66 32 60 34 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
</svg>
